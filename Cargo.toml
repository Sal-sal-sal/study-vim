[package]
name = "study-nvim"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"


[[bin]]
name = "study"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
