[package]
name = "study-nvim"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Portable study workspaces and Markdown navigation for Neovim"
repository = "https://github.com/Sal-sal-sal/study-vim"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
[[bin]]
name = "study"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
